<!doctype html>
<!--
  목적: 한 달치 등원·하원 기록을 학생 × 날짜 표로 보고, 고치고, 인쇄하는 교사용 화면입니다.
  사용처: 현황판의 '기록 보기'로 교사 PC 브라우저에서 http://localhost:<포트>/records 를 엽니다(server.js가 교사 PC에서만 내줍니다).
  근거: 학부모 상담에 날짜별 기록이 필요합니다(DEC-11). 현황판은 TV용 8칸 화면이라 한 달 표와 인쇄를 넣기 어려워 페이지를 나눴습니다.
-->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>출석 기록</title>
  <link rel="stylesheet" href="/css/records.css">
</head>
<body>
  <header class="bar no-print">
    <h1>출석 기록</h1>
    <div class="month">
      <button id="prev" class="btn" type="button" aria-label="이전 달">‹</button>
      <span id="month-label" aria-live="polite"></span>
      <button id="next" class="btn" type="button" aria-label="다음 달">›</button>
    </div>
    <select id="class-filter" class="select" aria-label="반 선택"></select>
    <button id="refresh" class="btn push" type="button">새로고침</button>
    <button id="print" class="btn" type="button">인쇄</button>
  </header>
  <p class="note no-print">칸을 누르면 그날 시각을 고칠 수 있어요. 기록이 없는 날은 결석이에요.</p>
  <p id="print-title" class="print-title" hidden></p>
  <div id="wrap" class="wrap"></div>

  <dialog id="edit-dialog" aria-labelledby="edit-title">
    <p id="edit-title" class="dialog-title"></p>
    <div id="visit-rows"></div>
    <button id="visit-add" class="btn" type="button">방문 추가</button>
    <p id="edit-error" class="error" role="alert"></p>
    <div class="dialog-foot">
      <button id="edit-save" class="btn" type="button">저장</button>
      <button id="edit-cancel" class="btn" type="button">닫기</button>
    </div>
  </dialog>

  <p id="toast" class="toast no-print" role="status" hidden></p>

  <script src="/js/common.js"></script>
  <script src="/js/records.js"></script>
</body>
</html>
