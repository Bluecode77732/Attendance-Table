<!doctype html>
<!--
  목적: 한 달치 등원·하원 기록을 학생 × 날짜 표로 보고, 고치고, 인쇄하는 교사용 화면이에요.
  사용처: 현황판의 '기록 보기'로 교사 PC 브라우저에서 http://localhost:<포트>/records 를 열어요(server.js가 교사 PC에서만 내줘요).
  근거: 학부모 상담에 날짜별 기록이 필요해요(DEC-11). 현황판은 TV용 8칸 화면이라 한 달 표와 인쇄를 넣기 어려워 페이지를 나눴어요.
-->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>출석 기록</title>
  <style>
    :root {
      --paper: #f4f1ea;
      --ink: #2b2b2b;
      --line: #cfc9bc;
      --today: #fff4c2;
      --weekend: #f0ece3;
      --left: #8a8a8a;
      --warn: #c93c3c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
      font-size: 14px;
    }

    .bar { display: flex; align-items: center; gap: 0.8rem; padding: 0.8rem 1rem; flex-wrap: wrap; }
    .bar h1 { margin: 0; font-size: 1.2rem; }
    .month { display: flex; align-items: center; gap: 0.5rem; font-size: 1.1rem; font-weight: 800; }
    .push { margin-left: auto; }
    .btn, .select {
      height: 2.1rem;
      padding: 0 0.8rem;
      border: 1px solid #b9b4a8;
      border-radius: 0.4rem;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .btn.danger { color: var(--warn); }
    .btn:focus-visible, .select:focus-visible { outline: 3px solid #2b6cff; outline-offset: 2px; }
    .note { margin: 0 1rem 0.6rem; font-size: 0.85rem; opacity: 0.7; }

    .wrap { overflow: auto; padding: 0 1rem 1rem; }
    table { border-collapse: collapse; background: #fff; font-variant-numeric: tabular-nums; }
    th, td { border: 1px solid var(--line); padding: 0.2rem 0.25rem; text-align: center; vertical-align: top; }
    th { background: #faf8f3; font-weight: 700; white-space: nowrap; }
    th.name, td.name { position: sticky; left: 0; z-index: 1; min-width: 6rem; background: #fff; text-align: left; white-space: nowrap; }
    th.name { background: #faf8f3; }
    .left-mark { color: var(--left); font-size: 0.8rem; }
    td.day { min-width: 3.4rem; font-size: 0.78rem; line-height: 1.3; cursor: pointer; }
    td.day:hover { outline: 2px solid #2b6cff; outline-offset: -2px; }
    td.day:focus-visible { outline: 3px solid #2b6cff; outline-offset: -3px; }
    .weekend { background: var(--weekend); }
    .today { background: var(--today); }
    .visit { display: block; white-space: nowrap; }
    .count { font-weight: 800; }
    .empty-msg { padding: 2rem 1rem; }

    dialog { width: min(30rem, 92vw); padding: 1.2rem 1.4rem; border: 0; border-radius: 0.8rem; }
    dialog::backdrop { background: rgba(20, 20, 20, 0.7); }
    .dialog-title { margin: 0 0 0.6rem; font-size: 1.2rem; font-weight: 800; }
    .visit-row { display: flex; align-items: center; gap: 0.5rem; margin: 0.4rem 0; }
    .field { height: 2.1rem; padding: 0 0.4rem; border: 1px solid #b9b4a8; border-radius: 0.4rem; font: inherit; }
    .dialog-foot { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1rem; }
    .error { min-height: 1.4em; margin: 0.4rem 0 0; color: var(--warn); font-weight: 700; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 1rem;
      padding: 0.6rem 1.2rem;
      border-radius: 0.6rem;
      background: rgba(30, 30, 30, 0.92);
      color: #fff;
      font-weight: 700;
      transform: translateX(-50%);
    }
    .toast[hidden] { display: none; }

    @media print {
      @page { size: A4 landscape; margin: 8mm; }
      body { background: #fff; font-size: 7pt; }
      .no-print { display: none !important; }
      .wrap { overflow: visible; padding: 0; }
      th.name, td.name { position: static; min-width: 0; }
      td.day { min-width: 0; padding: 0.5mm; font-size: 6.5pt; }
      th { padding: 0.5mm; font-size: 6.5pt; white-space: normal; }
      .visit { white-space: normal; margin-bottom: 0.6mm; }
      .today { background: none; }
      .print-title { display: block !important; margin: 0 0 4mm; font-size: 11pt; }
    }
  </style>
</head>
<body>
  <header class="bar no-print">
    <h1>출석 기록</h1>
    <div class="month">
      <button id="prev" class="btn" type="button" aria-label="이전 달">‹</button>
      <span id="month-label" aria-live="polite"></span>
      <button id="next" class="btn" type="button" aria-label="다음 달">›</button>
    </div>
    <select id="class-filter" class="select" aria-label="반 선택"></select>
    <button id="print" class="btn push" type="button">인쇄</button>
  </header>
  <p class="note no-print">칸을 누르면 그날 시각을 고칠 수 있어요. 기록이 없는 날은 결석이에요.</p>
  <p id="print-title" class="print-title" hidden></p>
  <div id="wrap" class="wrap"></div>

  <dialog id="edit-dialog" aria-labelledby="edit-title">
    <p id="edit-title" class="dialog-title"></p>
    <div id="visit-rows"></div>
    <button id="visit-add" class="btn" type="button">방문 추가</button>
    <p id="edit-error" class="error" role="alert"></p>
    <div class="dialog-foot">
      <button id="edit-save" class="btn" type="button">저장</button>
      <button id="edit-cancel" class="btn" type="button">닫기</button>
    </div>
  </dialog>

  <p id="toast" class="toast" role="status" hidden></p>

  <script>
    const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];
    const MAX_VISITS = 10;

    const wrap = document.getElementById('wrap');
    const monthLabel = document.getElementById('month-label');
    const classFilterEl = document.getElementById('class-filter');
    const printTitle = document.getElementById('print-title');
    const editDialog = document.getElementById('edit-dialog');
    const editTitle = document.getElementById('edit-title');
    const visitRows = document.getElementById('visit-rows');
    const editError = document.getElementById('edit-error');
    const toastEl = document.getElementById('toast');

    let month = currentMonth();
    let data = null;
    let classFilter = 'all';
    let editing = null;
    let toastTimer = null;

    // 목적: 서버 API를 부르고 JSON 응답을 돌려받아요.
    // 이유: 한 달 조회(GET)와 하루 수정(POST)이 같은 오류 처리를 써요.
    // 방법: body가 있으면 JSON POST, 없으면 캐시 없는 GET. 응답이 실패면 서버가 준 message로 예외를 던져요.
    async function api(path, body) {
      const options = body === undefined
        ? { cache: 'no-store' }
        : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
      const res = await fetch(path, options);
      let result = null;
      try {
        result = await res.json();
      } catch {
        // 본문이 JSON이 아니면 상태 코드로 설명한다
      }
      if (!res.ok) throw new Error((result && result.message) || `서버 오류 (${res.status})`);
      return result;
    }

    // 목적: 화면 아래에 짧은 안내를 띄워요.
    // 이유: 불러오기 실패나 저장 결과를 바로 알아야 해요.
    // 방법: 4초 뒤 자동으로 숨겨요.
    function showToast(text) {
      clearTimeout(toastTimer);
      toastEl.textContent = text;
      toastEl.hidden = false;
      toastTimer = setTimeout(() => { toastEl.hidden = true; }, 4000);
    }

    // 목적: 이번 달을 YYYY-MM으로 만들어요.
    // 이유: 처음 열면 이번 달 기록을 보여 줘요.
    // 방법: PC 현지 날짜로 조립해요.
    function currentMonth() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    }

    // 목적: 보고 있는 달을 앞뒤로 옮겨요.
    // 이유: 지난달 기록으로 상담하는 일이 많아요.
    // 방법: 연·월을 계산해 month를 바꾸고 다시 불러와요.
    function shiftMonth(delta) {
      const [y, m] = month.split('-').map(Number);
      const d = new Date(y, m - 1 + delta, 1);
      month = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
      load();
    }

    // 목적: 한 달치 기록을 서버에서 받아 표를 그려요.
    // 이유: 다른 달로 옮기거나 시각을 고친 뒤 최신 기록을 보여 줘야 해요.
    // 방법: /api/records?month= 를 불러 data에 두고 반 선택과 표를 다시 그려요.
    async function load() {
      const [y, m] = month.split('-').map(Number);
      monthLabel.textContent = `${y}년 ${m}월`;
      try {
        data = await api(`/api/records?month=${month}`);
      } catch (e) {
        showToast(e.message);
        return;
      }
      updateClassFilter();
      render();
    }

    // 목적: 반 선택 목록을 서버의 반 목록에 맞춰요.
    // 이유: 상담할 때 반별로 걸러 보기도 해요.
    // 방법: option을 다시 만들고, 고른 반이 사라졌으면 "전체"로 돌아가요.
    function updateClassFilter() {
      if (classFilter !== 'all' && !data.classes.some((c) => c.id === classFilter)) classFilter = 'all';
      classFilterEl.replaceChildren(new Option('전체', 'all'));
      for (const c of data.classes) classFilterEl.append(new Option(c.name, String(c.id)));
      classFilterEl.value = String(classFilter);
    }

    // 목적: 표에 넣을 학생을 골라요.
    // 이유: 재원생은 기록이 없어도 보여야 결석이 보이고, 퇴원생은 그 달 기록이 있을 때만 보여요.
    // 방법: 반 선택에 맞는 학생 중 퇴원하지 않았거나 그 달 기록이 있는 학생만 남겨요.
    function rowsToShow() {
      const hasRecord = (id) => Object.values(data.days).some((day) => day[id]);
      return data.students.filter((s) => (classFilter === 'all' || s.classIds.includes(classFilter))
        && (s.leftOn === null || hasRecord(s.id)));
    }

    // 목적: 학생 × 날짜 표를 그려요.
    // 이유: 한 달 출석을 한눈에 보고 인쇄해야 해요.
    // 방법: 날짜 칸마다 방문을 "등원–하원" 줄로 넣고, 주말과 오늘은 색을 달리해요. 끝에 출석 일수를 붙여요. 이름은 textContent로 넣어요.
    function render() {
      const [y, m] = month.split('-').map(Number);
      const lastDay = new Date(y, m, 0).getDate();
      const today = new Date();
      const todayKey = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
      const className = classFilter === 'all' ? '전체' : data.classes.find((c) => c.id === classFilter).name;
      printTitle.textContent = `${y}년 ${m}월 출석 기록 · ${className}`;

      const rows = rowsToShow();
      if (rows.length === 0) {
        const empty = document.createElement('p');
        empty.className = 'empty-msg';
        empty.textContent = '이 달에 보여 줄 학생이 없어요.';
        wrap.replaceChildren(empty);
        return;
      }

      const table = document.createElement('table');
      const head = table.createTHead().insertRow();
      const nameHead = document.createElement('th');
      nameHead.className = 'name';
      nameHead.textContent = '이름';
      head.append(nameHead);
      for (let d = 1; d <= lastDay; d++) {
        const th = document.createElement('th');
        const weekday = new Date(y, m - 1, d).getDay();
        th.textContent = `${d} ${WEEKDAYS[weekday]}`;
        if (weekday === 0 || weekday === 6) th.classList.add('weekend');
        head.append(th);
      }
      const countHead = document.createElement('th');
      countHead.textContent = '출석일';
      head.append(countHead);

      const body = table.createTBody();
      for (const student of rows) {
        const tr = body.insertRow();
        const nameCell = document.createElement('td');
        nameCell.className = 'name';
        nameCell.textContent = student.name;
        if (student.leftOn !== null) {
          const mark = document.createElement('span');
          mark.className = 'left-mark';
          mark.textContent = ' (퇴원)';
          nameCell.append(mark);
        }
        tr.append(nameCell);
        let attended = 0;
        for (let d = 1; d <= lastDay; d++) {
          const date = `${month}-${String(d).padStart(2, '0')}`;
          const visits = data.days[date]?.[student.id] ?? [];
          if (visits.length > 0) attended += 1;
          const td = document.createElement('td');
          td.className = 'day';
          td.tabIndex = 0;
          td.dataset.date = date;
          td.dataset.id = String(student.id);
          const weekday = new Date(y, m - 1, d).getDay();
          if (weekday === 0 || weekday === 6) td.classList.add('weekend');
          if (date === todayKey) td.classList.add('today');
          for (const v of visits) {
            // 인쇄할 때 31일이 A4 가로에 들어가도록 하원 시각은 줄을 바꿀 수 있게 둔다.
            const line = document.createElement('span');
            line.className = 'visit';
            line.append(`${v.in}–`, document.createElement('wbr'), v.out ?? '');
            td.append(line);
          }
          tr.append(td);
        }
        const countCell = document.createElement('td');
        countCell.className = 'count';
        countCell.textContent = String(attended);
        tr.append(countCell);
      }
      wrap.replaceChildren(table);
    }

    // 목적: 날짜 칸을 누르면 그날 기록을 고치는 창을 열어요.
    // 이유: 하원을 깜빡한 날 같은 실수를 교사가 고쳐야 상담 기록이 맞아요.
    // 방법: 그 학생·날짜의 방문을 복사해 시각 입력 줄로 만들어요. 기록이 없으면 빈 줄 하나로 시작해요.
    function openEdit(date, id) {
      const student = data.students.find((s) => s.id === id);
      if (!student) return;
      editing = { date, id };
      const [, m, d] = date.split('-').map(Number);
      editTitle.textContent = `${student.name} · ${m}월 ${d}일`;
      editError.textContent = '';
      visitRows.replaceChildren();
      const visits = data.days[date]?.[id] ?? [];
      for (const v of visits) addVisitRow(v.in, v.out ?? '');
      if (visits.length === 0) addVisitRow('', '');
      editDialog.showModal();
    }

    // 목적: 고치는 창에 방문 한 줄(등원, 하원, 삭제)을 더해요.
    // 이유: 하루에 두 번 온 학생도 있어요.
    // 방법: time 입력 두 개와 삭제 버튼을 만들어요. 10줄을 넘기지 않아요.
    function addVisitRow(inTime, outTime) {
      if (visitRows.children.length >= MAX_VISITS) return;
      const row = document.createElement('div');
      row.className = 'visit-row';
      const inLabel = document.createElement('label');
      const inInput = document.createElement('input');
      inInput.type = 'time';
      inInput.className = 'field';
      inInput.value = inTime;
      inInput.dataset.role = 'in';
      inLabel.append('등원 ', inInput);
      const outLabel = document.createElement('label');
      const outInput = document.createElement('input');
      outInput.type = 'time';
      outInput.className = 'field';
      outInput.value = outTime;
      outInput.dataset.role = 'out';
      outLabel.append('하원 ', outInput);
      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'btn danger';
      remove.textContent = '삭제';
      remove.addEventListener('click', () => row.remove());
      row.append(inLabel, outLabel, remove);
      visitRows.append(row);
    }

    // 목적: 고친 하루치 기록을 저장해요.
    // 이유: 저장하면 바로 표에 반영돼야 해요. 모든 줄을 지우고 저장하면 그날 기록이 지워져요.
    // 방법: 등원 시각이 빈 줄은 빼고 /api/records/edit으로 보내요. 서버가 순서와 형식을 확인하고, 틀리면 그 사유를 창에 보여 줘요.
    async function saveEdit() {
      const visits = [...visitRows.children]
        .map((row) => ({ in: row.querySelector('[data-role="in"]').value, out: row.querySelector('[data-role="out"]').value || null }))
        .filter((v) => v.in !== '');
      if (visits.length === 0 && !confirm('이날 기록을 모두 지울까요?')) return;
      try {
        await api('/api/records/edit', { date: editing.date, id: editing.id, visits });
      } catch (e) {
        editError.textContent = e.message;
        return;
      }
      editDialog.close();
      showToast('저장했어요.');
      load();
    }

    document.getElementById('prev').addEventListener('click', () => shiftMonth(-1));
    document.getElementById('next').addEventListener('click', () => shiftMonth(1));
    classFilterEl.addEventListener('change', () => {
      classFilter = classFilterEl.value === 'all' ? 'all' : Number(classFilterEl.value);
      render();
    });
    document.getElementById('print').addEventListener('click', () => window.print());
    wrap.addEventListener('click', (event) => {
      const cell = event.target.closest('td.day');
      if (cell) openEdit(cell.dataset.date, Number(cell.dataset.id));
    });
    wrap.addEventListener('keydown', (event) => {
      const cell = event.target.closest('td.day');
      if (cell && (event.key === 'Enter' || event.key === ' ')) {
        event.preventDefault();
        openEdit(cell.dataset.date, Number(cell.dataset.id));
      }
    });
    document.getElementById('visit-add').addEventListener('click', () => addVisitRow('', ''));
    document.getElementById('edit-save').addEventListener('click', saveEdit);
    document.getElementById('edit-cancel').addEventListener('click', () => editDialog.close());

    load();
  </script>
</body>
</html>
