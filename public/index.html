<!doctype html>
<!--
  목적: A4를 세 번 접은 8칸처럼 학생 출석을 칸마다 보여 주는 교사용 TV 화면. 가로 화면 전용.
  사용처: 교사 PC의 브라우저에서 http://localhost:<포트>로 열어 TV에 띄운다(server.js가 교사 PC에서만 내준다).
  근거: 출석 데이터를 서버가 들고 있어야 학생 폰의 체크가 이 화면에 반영된다. 그래서 localStorage 저장을 없애고 서버 상태를 그린다.
-->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>출석부</title>
  <style>
    :root {
      --present: #178a48;
      --absent: #c93c3c;
      --paper: #f4f1ea;
      --ink: #2b2b2b;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; }

    /* TV는 멀리서 보니 rem 기준 글자·여백이 화면 폭에 비례해 커지게 한다 */
    html { font-size: clamp(16px, 1.3vw, 48px); }

    body {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    }

    .bar {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.6rem 0.9rem;
    }
    .bar h1 { margin: 0; font-size: 1.1rem; }
    .summary { margin: 0; font-size: 0.95rem; font-weight: 700; }
    .hint { margin: 0; font-size: 0.8rem; opacity: 0.6; }
    .push { margin-left: auto; }

    .btn {
      height: 2.25rem;
      padding: 0 1rem;
      border: 1px solid #b9b4a8;
      border-radius: 0.5rem;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn[hidden] { display: none; }
    .btn:focus-visible { outline: 3px solid #2b6cff; outline-offset: 2px; }

    .qr-box {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0;
      border: 0;
      background: none;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
    }
    .qr-box:focus-visible { outline: 3px solid #2b6cff; outline-offset: 2px; }
    .qr-small {
      display: grid;
      place-items: center;
      width: 5rem;
      height: 5rem;
      border: 1px solid #b9b4a8;
      border-radius: 0.4rem;
      background: #fff;
      overflow: hidden;
      font-size: 0.7rem;
    }
    .qr-small svg, .qr-big svg { display: block; width: 100%; height: 100%; }
    .qr-timer {
      min-width: 2.6em;
      font-size: 0.9rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .pager { display: flex; align-items: center; gap: 0.6rem; }
    .pager button {
      width: 2.25rem;
      height: 2.25rem;
      border: 1px solid #b9b4a8;
      border-radius: 0.5rem;
      background: #fff;
      color: var(--ink);
      font-size: 1.3rem;
      line-height: 1;
      cursor: pointer;
    }
    .pager button:disabled { opacity: 0.35; cursor: default; }
    .pager button:focus-visible { outline: 3px solid #2b6cff; outline-offset: 2px; }
    #page-label { min-width: 3.5em; text-align: center; font-variant-numeric: tabular-nums; }

    .grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 0.4rem;
      padding: 0 0.75rem 0.75rem;
    }

    .cell {
      position: relative;
      overflow: hidden;
      border-radius: 0.65rem;
      transition: background-color 0.25s ease;
    }
    .cell.present { background: var(--present); }
    .cell.absent { background: var(--absent); }
    .cell.empty { background: rgba(0, 0, 0, 0.04); }

    .toggle {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 0 0.5em;
      border: 0;
      background: none;
      color: #fff;
      font: inherit;
      cursor: pointer;
    }
    .toggle:focus-visible { outline: 4px solid #fff; outline-offset: -8px; }

    .name {
      font-size: clamp(2rem, min(5vw, 10vh), 12rem);
      font-weight: 800;
      line-height: 1.15;
      text-align: center;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    /* 색만으로 구분하지 않도록 상태를 글자로도 적는다 */
    .status {
      padding: 0.15em 0.8em;
      border: 2px solid rgba(255, 255, 255, 0.75);
      border-radius: 999px;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    /* 폰이 이 이름에 묶여 있다는 표시 — 교사가 누가 등록을 마쳤는지 한눈에 본다 */
    .badge {
      position: absolute;
      top: 0.6rem;
      left: 0.7rem;
      padding: 0.1em 0.6em;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.3);
      color: #fff;
      font-size: 0.8rem;
      font-weight: 700;
      pointer-events: none;
    }

    .actions {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      display: flex;
      gap: 0.4rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }
    .cell:hover .actions,
    .cell:focus-within .actions {
      opacity: 1;
      pointer-events: auto;
    }
    .icon {
      width: 2.25rem;
      height: 2.25rem;
      border: 0;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.35);
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }
    .icon.pill { width: auto; padding: 0 0.9rem; border-radius: 999px; font-size: 0.9rem; font-weight: 700; }
    .icon:hover { background: rgba(0, 0, 0, 0.55); }
    .icon:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

    .cell.add { border: 3px dashed rgba(0, 0, 0, 0.25); }
    .cell.add .toggle { color: #444; opacity: 0.35; transition: opacity 0.35s ease; }
    .cell.add:hover .toggle,
    .cell.add .toggle:focus-visible { opacity: 1; }
    .cell.add .plus { font-size: 3rem; line-height: 1; }
    .cell.add .label { font-size: 1rem; font-weight: 700; }

    .name-input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      outline: none;
      background: transparent;
      box-shadow: inset 0 0 0 4px rgba(255, 255, 255, 0.85);
      color: #fff;
      caret-color: #fff;
      font: inherit;
      font-size: clamp(2rem, min(5vw, 10vh), 12rem);
      font-weight: 800;
      text-align: center;
    }

    /* 큰 QR — 교실 뒤에서도 찍을 수 있게 화면 가운데를 크게 쓴다 */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(20, 20, 20, 0.9);
      cursor: pointer;
    }
    .overlay[hidden] { display: none; }
    .overlay-card { display: flex; flex-direction: column; align-items: center; gap: 0.7rem; color: #fff; text-align: center; }
    .qr-big {
      display: grid;
      place-items: center;
      width: min(62vh, 50vw);
      aspect-ratio: 1;
      border-radius: 0.5rem;
      background: #fff;
      color: var(--ink);
      overflow: hidden;
    }
    .overlay-title { margin: 0; font-size: 1.6rem; font-weight: 800; }
    .overlay-meta { margin: 0; font-size: 1.1rem; }
    .overlay-hint { margin: 0; font-size: 0.85rem; opacity: 0.6; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 1.2rem;
      z-index: 20;
      max-width: 80vw;
      padding: 0.6rem 1.2rem;
      border-radius: 0.6rem;
      background: rgba(30, 30, 30, 0.92);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      transform: translateX(-50%);
    }
    .toast[hidden] { display: none; }

    @keyframes from-right { from { opacity: 0; transform: translateX(48px); } to { opacity: 1; transform: none; } }
    @keyframes from-left { from { opacity: 0; transform: translateX(-48px); } to { opacity: 1; transform: none; } }
    .grid.slide-next { animation: from-right 0.28s ease-out; }
    .grid.slide-prev { animation: from-left 0.28s ease-out; }

    /* 마우스가 없는 기기는 hover가 없으니 버튼을 늘 보이게 한다 */
    @media (hover: none) {
      .actions { opacity: 1; pointer-events: auto; }
      .cell.add .toggle { opacity: 0.7; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <h1>출석부</h1>
    <p id="summary" class="summary"></p>
    <p class="hint">← → 페이지 · Q 큰 QR</p>
    <button id="reset" class="btn push" type="button">새 수업 시작</button>
    <button id="qr-box" class="qr-box" type="button" aria-label="QR 크게 보기">
      <span id="qr-timer" class="qr-timer"></span>
      <span id="qr-small" class="qr-small"></span>
    </button>
    <nav class="pager" aria-label="페이지 이동">
      <button id="prev" type="button" aria-label="이전 페이지">‹</button>
      <span id="page-label" aria-live="polite"></span>
      <button id="next" type="button" aria-label="다음 페이지">›</button>
    </nav>
  </header>
  <main id="grid" class="grid" aria-label="학생 출석 칸"></main>

  <div id="qr-overlay" class="overlay" hidden>
    <div class="overlay-card">
      <p class="overlay-title">폰 카메라로 이 QR을 찍어 주세요</p>
      <div id="qr-big" class="qr-big"></div>
      <p id="qr-meta" class="overlay-meta"></p>
      <button id="addr-next" class="btn" type="button" hidden>QR이 열리지 않으면: 다른 주소로 바꾸기</button>
      <p class="overlay-hint">닫으려면 아무 곳이나 누르거나 Esc를 누르세요</p>
    </div>
  </div>

  <p id="toast" class="toast" role="status" hidden></p>

  <script src="/vendor/qrcode.js"></script>
  <script>
    const PER_PAGE = 8;
    const NAME_MAX = 12;
    const POLL_MS = 2000;

    const grid = document.getElementById('grid');
    const summaryEl = document.getElementById('summary');
    const pageLabel = document.getElementById('page-label');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const resetBtn = document.getElementById('reset');
    const qrBox = document.getElementById('qr-box');
    const qrSmall = document.getElementById('qr-small');
    const qrTimer = document.getElementById('qr-timer');
    const qrOverlay = document.getElementById('qr-overlay');
    const qrBig = document.getElementById('qr-big');
    const qrMeta = document.getElementById('qr-meta');
    const addrNextBtn = document.getElementById('addr-next');
    const toastEl = document.getElementById('toast');

    let students = [];
    let rev = 0;
    let page = 0;
    let editingId = null;
    let slide = '';
    let drawnQrUrl;
    let qrExpiresAt = 0;
    let lastPollAt = 0;
    let polling = false;
    let toastTimer = null;
    let toastKind = '';

    // 목적: 서버 API를 부르고 JSON 응답을 돌려받는다.
    // 이유: 조회(GET)와 변경(POST)이 같은 헤더·오류 처리를 쓴다.
    // 방법: body가 있으면 JSON POST, 없으면 캐시 없는 GET. 응답이 실패면 서버가 준 message로 예외를 던진다.
    async function api(path, body) {
      const options = body === undefined
        ? { cache: 'no-store' }
        : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
      const res = await fetch(path, options);
      let data = null;
      try {
        data = await res.json();
      } catch {
        // 본문이 JSON이 아니면 상태 코드로 설명한다
      }
      if (!res.ok) throw new Error((data && data.message) || `서버 오류 (${res.status})`);
      return data;
    }

    // 목적: 교사 동작(토글·해제·삭제 등)을 서버에 보내고 돌아온 최신 상태를 그린다.
    // 이유: 모든 쓰기 동작이 같은 "요청 → 상태 반영 → 실패 안내" 흐름을 쓴다.
    // 방법: api 호출 후 applyState. 실패하면 토스트로 사유를 알린다.
    async function act(path, body) {
      try {
        applyState(await api(path, body));
      } catch (e) {
        showToast(e.message, 4000, 'error');
      }
    }

    // 목적: 화면 아래에 짧은 안내 문구를 띄운다.
    // 이유: 서버 연결 끊김이나 동작 실패를 교사가 바로 알아야 한다.
    // 방법: ms가 0이면 직접 지울 때까지 유지(연결 끊김용). 그 외에는 ms 뒤 자동으로 숨긴다.
    function showToast(text, ms, kind) {
      clearTimeout(toastTimer);
      toastEl.textContent = text;
      toastEl.hidden = false;
      toastKind = kind;
      if (ms > 0) toastTimer = setTimeout(hideToast, ms);
    }

    // 목적: 안내 문구를 숨긴다.
    // 이유: 연결이 돌아오면 끊김 안내가 남아 있으면 안 된다.
    // 방법: hidden 처리하고 종류를 비운다.
    function hideToast() {
      clearTimeout(toastTimer);
      toastEl.hidden = true;
      toastKind = '';
    }

    // 목적: 학생 목록에서 "화면 구조가 바뀌었는지"를 판단할 키를 만든다.
    // 이유: 이름·등록 여부가 바뀐 때만 칸을 다시 만들고, 출석 색만 바뀐 때는 제자리에서 칠해야 마우스를 올린 칸이 깜빡이지 않는다.
    // 방법: id·이름·등록 여부를 이어 붙인 문자열(출석 여부는 제외).
    function structureKey(list) {
      return list.map((s) => `${s.id}|${s.name}|${s.bound ? 1 : 0}`).join('\n');
    }

    // 목적: 서버가 준 최신 상태를 화면에 반영한다.
    // 이유: 폴링 응답과 교사 동작 응답이 모두 이 한 경로로 화면을 갱신해야 서로 어긋나지 않는다.
    // 방법: 옛 응답(rev가 작음)은 버리고, QR은 항상 갱신. 이름 입력 중이면 입력창이 날아가지 않게 칸 갱신은 건너뛴다. 구조가 같으면 색만, 다르면 전체를 다시 그린다.
    function applyState(state) {
      if (state.rev < rev) return;
      updateQr(state);
      if (editingId !== null) return;
      rev = state.rev;
      const structural = structureKey(state.students) !== structureKey(students);
      students = state.students;
      if (structural) {
        render();
      } else {
        paintAll();
        updateHeader();
      }
    }

    // 목적: 서버 상태를 한 번 가져와 반영한다.
    // 이유: 학생 폰의 출석이 몇 초 안에 이 화면에 나타나야 한다.
    // 방법: 겹쳐 호출되지 않게 막고, 실패하면 끊김 안내를, 성공하면 그 안내를 지운다.
    async function poll() {
      if (polling) return;
      polling = true;
      lastPollAt = performance.now();
      try {
        applyState(await api('/api/state'));
        if (toastKind === 'offline') hideToast();
      } catch {
        showToast('서버와 연결이 끊겼어요. 시작 창(검은 창)이 켜져 있는지 확인해 주세요.', 0, 'offline');
      } finally {
        polling = false;
      }
    }

    // 목적: QR 이미지와 접속 주소 안내를 최신 상태로 맞춘다.
    // 이유: 코드가 30초마다 바뀌므로 주소가 바뀔 때마다 QR을 새로 그려야 한다.
    // 방법: 남은 시간을 기준 시각으로 저장하고, URL이 달라졌을 때만 QR을 다시 그린다.
    function updateQr(state) {
      qrExpiresAt = performance.now() + state.codeExpiresInMs;
      if (state.joinUrl !== drawnQrUrl) {
        drawnQrUrl = state.joinUrl;
        drawQr(state.joinUrl);
      }
      addrNextBtn.hidden = state.addressCount < 2;
      qrMeta.textContent = state.address
        ? `접속 주소: ${state.address}:${location.port}  ·  QR은 30초마다 바뀝니다`
        : '같은 네트워크 주소를 찾지 못했어요. PC가 Wi-Fi/유선망에 연결되어 있는지 확인해 주세요.';
    }

    // 목적: 접속 주소를 QR 이미지로 그린다(작은 것과 큰 것).
    // 이유: 학생이 이 QR을 찍어야 출석 페이지가 열린다.
    // 방법: 번들한 qrcode 라이브러리로 SVG를 만들어 두 곳에 넣는다. 오류 정정은 L — 화면에서 보는 QR이라 칸을 크게 하는 쪽이 멀리서 인식된다. 주소가 없으면 안내 글자.
    function drawQr(url) {
      if (!url) {
        qrSmall.textContent = '주소 없음';
        qrBig.textContent = '주소 없음';
        return;
      }
      const code = qrcode(0, 'L');
      code.addData(url);
      code.make();
      const svg = code.createSvgTag({ cellSize: 1, margin: 4, scalable: true });
      qrSmall.innerHTML = svg;
      qrBig.innerHTML = svg;
    }

    // 목적: QR 갱신까지 남은 초를 표시하고, 시간이 다 되면 새 코드를 바로 받아 온다.
    // 이유: 폴링 주기(2초)를 기다리면 새 QR이 늦게 뜰 수 있다.
    // 방법: 0.5초마다 남은 시간을 계산해 글자를 바꾸고, 0이 되면(너무 잦지 않게) poll을 부른다.
    function tickTimer() {
      const remaining = Math.max(0, Math.ceil((qrExpiresAt - performance.now()) / 1000));
      qrTimer.textContent = `${remaining}초`;
      if (remaining === 0 && performance.now() - lastPollAt > 800) poll();
    }

    // 목적: 큰 QR 화면을 열고 닫는다.
    // 이유: 교실 뒤쪽 학생도 찍을 수 있게 필요할 때만 크게 보여 준다.
    // 방법: hidden 속성을 켜고 끈다.
    function setOverlay(open) {
      qrOverlay.hidden = !open;
    }

    // 목적: 현재 페이지의 8칸과 머리글을 화면에 그린다.
    // 이유: 페이지 이동·추가·삭제·이름 수정·구조 변경이 모두 같은 그리기 경로를 쓰게 한다.
    // 방법: 해당 구간 학생 칸 → 마지막 페이지면 추가 칸 → 나머지는 빈 칸, 이동이면 슬라이드 애니메이션.
    function render() {
      page = Math.min(Math.max(page, 0), pageCount() - 1);
      const visible = students.slice(page * PER_PAGE, (page + 1) * PER_PAGE);

      grid.replaceChildren();
      for (let i = 0; i < PER_PAGE; i++) {
        if (i < visible.length) grid.append(buildCell(visible[i]));
        else if (i === visible.length) grid.append(buildAddCell());
        else grid.append(buildEmptyCell());
      }

      grid.classList.remove('slide-next', 'slide-prev');
      if (slide) {
        void grid.offsetWidth;
        grid.classList.add(slide);
        slide = '';
      }

      updateHeader();

      const editor = grid.querySelector('.name-input');
      if (editor) {
        editor.focus();
        editor.select();
      }
    }

    // 목적: 전체 페이지 수를 계산한다.
    // 이유: 마지막 페이지에는 늘 "학생 추가" 칸이 들어갈 자리가 있어야 한다.
    // 방법: 8명이 딱 차면 추가 칸만 있는 페이지가 하나 더 생기도록 floor(n/8)+1.
    function pageCount() {
      return Math.floor(students.length / PER_PAGE) + 1;
    }

    // 목적: 출석 인원과 페이지 표시, 이전/다음 버튼 상태를 갱신한다.
    // 이유: 출석이 바뀔 때는 칸을 다시 만들지 않고 머리글만 고치면 된다.
    // 방법: present 개수를 세고, 첫/마지막 페이지에서는 해당 방향 버튼을 끈다.
    function updateHeader() {
      const presentCount = students.filter((s) => s.present).length;
      summaryEl.textContent = `출석 ${presentCount} / ${students.length}`;
      pageLabel.textContent = `${page + 1} / ${pageCount()}`;
      prevBtn.disabled = page === 0;
      nextBtn.disabled = page === pageCount() - 1;
    }

    // 목적: 학생 한 명의 칸(이름·출석 토글·등록 표시·수정/해제/삭제 버튼)을 만든다.
    // 이유: 이름 크게 + 출석이면 초록, 미출석이면 빨강이라는 화면의 핵심 단위다.
    // 방법: 전체를 덮는 토글 버튼과 별도의 액션 버튼을 형제로 두고(버튼 안에 버튼을 넣지 않음), 이름은 textContent로 넣는다. 폰이 묶인 학생에게만 "등록됨" 표시와 "해제" 버튼을 붙인다.
    function buildCell(student) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.id = String(student.id);

      if (student.id === editingId) {
        cell.append(buildEditor(student));
        paintCell(cell, student);
        return cell;
      }

      const toggle = document.createElement('button');
      toggle.type = 'button';
      toggle.className = 'toggle';
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = student.name;
      const status = document.createElement('span');
      status.className = 'status';
      toggle.append(name, status);

      const actions = document.createElement('div');
      actions.className = 'actions';
      actions.append(buildIconButton('edit', '✎', `${student.name} 이름 수정`));
      if (student.bound) actions.append(buildPillButton('release', '해제', `${student.name} 폰 등록 해제`));
      actions.append(buildIconButton('delete', '✕', `${student.name} 삭제`));

      cell.append(toggle, actions);
      if (student.bound) {
        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = '등록됨';
        cell.append(badge);
      }
      paintCell(cell, student);
      return cell;
    }

    // 목적: 칸 모서리에 뜨는 동그란 액션 버튼 하나를 만든다.
    // 이유: 수정/삭제 버튼의 모양과 접근성 이름을 한 곳에서 맞춘다.
    // 방법: data-act로 동작을 구분하고 aria-label에 학생 이름을 넣는다.
    function buildIconButton(act, glyph, label) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'icon';
      button.dataset.act = act;
      button.setAttribute('aria-label', label);
      button.textContent = glyph;
      return button;
    }

    // 목적: 글자가 있는 알약 모양 액션 버튼을 만든다.
    // 이유: "해제"는 아이콘만으로는 뜻이 안 통해서 글자로 보여 준다.
    // 방법: buildIconButton과 같은 구조에 pill 클래스를 더한다.
    function buildPillButton(act, text, label) {
      const button = buildIconButton(act, text, label);
      button.classList.add('pill');
      return button;
    }

    // 목적: 마지막 페이지의 빈 자리에 "학생 추가" 칸을 만든다.
    // 이유: 8칸을 넘는 학생은 새 페이지로 이어져야 해서 추가 경로가 필요하다.
    // 방법: 점선 칸 하나. 평소엔 흐리게 있다가 마우스를 올리면 서서히 또렷해진다.
    function buildAddCell() {
      const cell = document.createElement('div');
      cell.className = 'cell add';
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'toggle';
      const plus = document.createElement('span');
      plus.className = 'plus';
      plus.textContent = '+';
      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = '학생 추가';
      button.append(plus, label);
      cell.append(button);
      return cell;
    }

    // 목적: 학생이 없는 남는 칸을 만든다.
    // 이유: 마지막 페이지도 8칸 격자가 무너지지 않아야 접힌 종이 느낌이 유지된다.
    // 방법: 눈에 띄지 않는 빈 div를 스크린리더에서 숨긴다.
    function buildEmptyCell() {
      const cell = document.createElement('div');
      cell.className = 'cell empty';
      cell.setAttribute('aria-hidden', 'true');
      return cell;
    }

    // 목적: 칸 안에서 바로 이름을 고치는 입력창을 만든다.
    // 이유: prompt() 창은 큰 글씨 화면 흐름을 끊는다.
    // 방법: Enter 저장, Esc 취소, 포커스를 잃으면 저장. 한글 조합 중 Enter는 무시한다.
    function buildEditor(student) {
      const input = document.createElement('input');
      input.className = 'name-input';
      input.value = student.name;
      input.maxLength = NAME_MAX;
      input.setAttribute('aria-label', '학생 이름');
      input.addEventListener('keydown', (event) => {
        if (event.isComposing) return;
        if (event.key === 'Enter') {
          commitEdit(student.id, input.value);
          focusToggle(student.id);
        } else if (event.key === 'Escape') {
          cancelEdit(student.id);
          focusToggle(student.id);
        }
      });
      input.addEventListener('blur', () => commitEdit(student.id, input.value));
      return input;
    }

    // 목적: 칸의 색·상태 글자·aria 상태를 학생 데이터에 맞춘다.
    // 이유: 그릴 때와 서버 상태가 바뀔 때 같은 모양이 나와야 하고, 제자리 갱신이어야 포커스가 안 날아간다.
    // 방법: present/absent 클래스를 갈아 끼우고 토글 버튼의 aria-pressed와 글자를 바꾼다.
    function paintCell(cell, student) {
      cell.classList.toggle('present', student.present);
      cell.classList.toggle('absent', !student.present);
      const toggle = cell.querySelector('.toggle');
      if (!toggle) return;
      toggle.setAttribute('aria-pressed', String(student.present));
      toggle.querySelector('.status').textContent = student.present ? '출석' : '미출석';
    }

    // 목적: 지금 화면의 모든 학생 칸 색을 최신 출석 상태로 맞춘다.
    // 이유: 학생 폰에서 체크가 들어오면 칸을 다시 만들지 않고 색만 바꿔야 한다.
    // 방법: data-id로 학생을 찾아 paintCell을 부른다.
    function paintAll() {
      for (const cell of grid.querySelectorAll('.cell[data-id]')) {
        const student = students.find((s) => s.id === Number(cell.dataset.id));
        if (student) paintCell(cell, student);
      }
    }

    // 목적: 격자 안의 클릭을 칸별 동작(토글·수정·해제·삭제·추가)으로 나눠 준다.
    // 이유: 페이지를 넘길 때마다 칸을 새로 만들므로 칸마다 리스너를 달지 않는다.
    // 방법: 이벤트 위임. 눌린 버튼과 가장 가까운 .cell의 data-id로 학생을 찾는다.
    function onGridClick(event) {
      const button = event.target.closest('button');
      const cell = event.target.closest('.cell');
      if (!button || !cell) return;

      if (cell.classList.contains('add')) {
        addStudent();
        return;
      }

      const student = students.find((s) => s.id === Number(cell.dataset.id));
      if (!student) return;

      if (button.classList.contains('toggle')) act('/api/toggle', { id: student.id });
      else if (button.dataset.act === 'edit') startEdit(student);
      else if (button.dataset.act === 'release') releaseStudent(student);
      else if (button.dataset.act === 'delete') removeStudent(student);
    }

    // 목적: 학생 이름 수정을 시작한다.
    // 이유: 칸 안에서 바로 고치게 하려는 것이다.
    // 방법: editingId를 잡고 다시 그리면 해당 칸이 입력창으로 나온다.
    function startEdit(student) {
      editingId = student.id;
      render();
    }

    // 목적: 입력한 이름을 저장하고 수정 상태를 끝낸다.
    // 이유: Enter와 blur가 연달아 불려도 한 번만 처리해야 한다(다시 그리면서 입력창이 사라질 때 blur가 또 온다).
    // 방법: editingId가 이미 다르면 바로 반환. 바뀐 이름이면 화면에 먼저 반영하고 서버에 보낸다(공백뿐이면 버림). 서버 응답이 실패하면 다음 폴링이 원래 이름으로 되돌린다.
    function commitEdit(id, value) {
      if (editingId !== id) return;
      editingId = null;
      const student = students.find((s) => s.id === id);
      const name = value.trim();
      if (student && name && name !== student.name) {
        student.name = name;
        act('/api/rename', { id, name });
      }
      render();
    }

    // 목적: 이름 수정을 저장 없이 끝낸다.
    // 이유: Esc로 실수를 되돌릴 수 있어야 한다.
    // 방법: commitEdit과 같은 중복 호출 방어 후 editingId만 풀고 다시 그린다.
    function cancelEdit(id) {
      if (editingId !== id) return;
      editingId = null;
      render();
    }

    // 목적: 수정을 마친 학생 칸의 토글 버튼으로 포커스를 돌려준다.
    // 이유: 칸을 다시 만들면 포커스가 body로 빠져 키보드 사용자가 자리를 잃는다.
    // 방법: Enter/Esc로 끝낼 때만 호출한다(blur로 끝났으면 사용자가 다른 곳을 누른 것이라 건드리지 않는다).
    function focusToggle(id) {
      const toggle = grid.querySelector(`[data-id="${id}"] .toggle`);
      if (toggle) toggle.focus();
    }

    // 목적: 새 학생을 명단 끝에 넣고 바로 이름을 입력하게 한다.
    // 이유: 8명을 넘는 학생을 받는 유일한 경로다.
    // 방법: 서버에 추가 요청 → 응답 상태를 반영 → 새 학생이 있는 페이지로 이동 → 수정 상태로 렌더.
    async function addStudent() {
      try {
        const state = await api('/api/add', {});
        editingId = null;
        applyState(state);
        editingId = state.id;
        page = Math.floor((students.length - 1) / PER_PAGE);
        render();
      } catch (e) {
        showToast(e.message, 4000, 'error');
      }
    }

    // 목적: 학생을 명단에서 지운다.
    // 이유: 전학·오입력 정리. 지우면 되돌릴 수 없고 그 학생의 폰 등록도 함께 사라진다.
    // 방법: confirm으로 한 번 확인한 뒤 서버에 삭제를 요청한다(페이지는 render가 범위로 보정).
    function removeStudent(student) {
      if (!confirm(`'${student.name}' 학생을 삭제할까요?`)) return;
      act('/api/delete', { id: student.id });
    }

    // 목적: 학생 이름에 묶인 폰 등록을 푼다.
    // 이유: 다른 사람이 이름을 먼저 골랐거나 폰을 바꾼 경우, 본인이 다시 등록할 수 있어야 한다.
    // 방법: confirm으로 영향(출석 표시도 지워짐)을 알린 뒤 서버에 해제를 요청한다.
    function releaseStudent(student) {
      if (!confirm(`'${student.name}' 학생의 폰 등록을 해제할까요?\n출석 표시도 지워지고, 학생이 QR을 찍어 이름을 다시 골라야 해요.`)) return;
      act('/api/release', { id: student.id });
    }

    // 목적: 새 수업을 시작한다 — 모든 학생을 미출석으로 되돌린다.
    // 이유: 수업마다 출석을 처음부터 받아야 한다. 폰 등록은 다음 수업에도 유지돼야 한다.
    // 방법: confirm 후 서버에 초기화를 요청한다.
    function resetAttendance() {
      if (!confirm('모든 학생을 미출석으로 되돌리고 새 수업을 시작할까요?\n폰 등록은 그대로 유지돼요.')) return;
      act('/api/reset', {});
    }

    // 목적: 페이지를 앞뒤로 넘긴다.
    // 이유: 8명을 넘는 학생을 옆 페이지로 보기 위해서다.
    // 방법: 범위 안으로 보정하고 바뀔 때만, 방향에 맞는 슬라이드 클래스를 예약한 뒤 렌더.
    function goPage(delta) {
      const target = Math.min(Math.max(page + delta, 0), pageCount() - 1);
      if (target === page) return;
      slide = delta > 0 ? 'slide-next' : 'slide-prev';
      page = target;
      render();
    }

    // 목적: 키보드 입력을 처리한다 — ←/→는 페이지 이동, Q는 큰 QR, Esc는 큰 QR 닫기.
    // 이유: 교사가 마우스 없이도 TV 앞에서 조작할 수 있어야 한다.
    // 방법: 이름 입력 중이거나 조합키가 눌려 있으면 무시. Q는 한글 입력 상태에서도 되도록 key가 아닌 물리 키(code)로 판별한다.
    function onKeydown(event) {
      if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
      if (event.target instanceof HTMLInputElement) return;
      if (event.key === 'ArrowRight') goPage(1);
      else if (event.key === 'ArrowLeft') goPage(-1);
      else if (event.code === 'KeyQ') setOverlay(qrOverlay.hidden);
      else if (event.key === 'Escape') setOverlay(false);
    }

    grid.addEventListener('click', onGridClick);
    prevBtn.addEventListener('click', () => goPage(-1));
    nextBtn.addEventListener('click', () => goPage(1));
    resetBtn.addEventListener('click', resetAttendance);
    qrBox.addEventListener('click', () => setOverlay(true));
    qrOverlay.addEventListener('click', () => setOverlay(false));
    addrNextBtn.addEventListener('click', (event) => {
      event.stopPropagation();
      act('/api/address/next', {});
    });
    document.addEventListener('keydown', onKeydown);

    poll();
    setInterval(poll, POLL_MS);
    setInterval(tickTimer, 500);
  </script>
</body>
</html>
