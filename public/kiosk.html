<!doctype html>
<!--
  목적: 학원에 둔 출석 기기(갤럭시)에서 학생이 휴대폰번호 뒷 4자리를 눌러 등원·하원하는 화면이에요.
  사용처: 출석 기기의 브라우저에서 http://<교사 PC 주소>:<포트>/k 로 열어요(server.js가 누구에게나 내주고, 출석은 등록된 기기만 돼요).
  근거: 학생 폰이 학원 공유기에 접속할 수 없어서 QR 출석 대신 학원 기기에서 번호로 출석해요(DEC-10). 예전 학생 화면은 이름 고르기용이라 다시 쓸 수 없었어요.
-->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>출석</title>
  <style>
    :root {
      --in: #178a48;
      --out: #6b6b6b;
      --warn: #b4581c;
      --paper: #f4f1ea;
      --ink: #2b2b2b;
      --key: #ffffff;
      --key-line: #cfc9bc;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; }

    body {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      background: var(--paper);
      color: var(--ink);
      font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1.2rem;
      text-align: center;
    }
    .screen[hidden] { display: none; }

    .title { margin: 0; font-size: 1.6rem; font-weight: 800; }
    .text { margin: 0; font-size: 1.1rem; line-height: 1.5; }
    .sub { margin: 0; font-size: 0.95rem; opacity: 0.65; }

    .dots { display: flex; gap: 0.8rem; min-height: 3rem; align-items: center; }
    .dot {
      width: 2.4rem;
      height: 3rem;
      border-bottom: 4px solid var(--key-line);
      font-size: 2.2rem;
      font-weight: 800;
      line-height: 3rem;
    }
    .dot.filled { border-color: var(--ink); }

    .message { margin: 0; min-height: 1.5em; font-size: 1.05rem; font-weight: 700; color: var(--warn); }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.6rem;
      width: min(92vw, 26rem);
    }
    .key {
      height: min(15vw, 5.2rem);
      border: 1px solid var(--key-line);
      border-radius: 0.9rem;
      background: var(--key);
      color: var(--ink);
      font: inherit;
      font-size: 2rem;
      font-weight: 700;
      cursor: pointer;
    }
    .key:active { background: #e8e3d8; }
    .key.small { font-size: 1.1rem; }
    .key:disabled { opacity: 0.35; }

    .choices { display: flex; flex-direction: column; gap: 0.7rem; width: min(92vw, 26rem); }
    .choice, .btn {
      min-height: 4rem;
      border: 1px solid var(--key-line);
      border-radius: 0.9rem;
      background: var(--key);
      color: var(--ink);
      font: inherit;
      font-size: 1.5rem;
      font-weight: 800;
      cursor: pointer;
    }
    .btn { min-height: 3.2rem; padding: 0 1.6rem; font-size: 1.1rem; }

    #result.in { background: var(--in); color: #fff; }
    #result.out { background: var(--out); color: #fff; }
    #result.warn { background: var(--warn); color: #fff; }
    .big { margin: 0; font-size: clamp(2rem, 9vw, 3.4rem); font-weight: 800; line-height: 1.25; word-break: keep-all; }
    .time { margin: 0; font-size: clamp(1.4rem, 6vw, 2.2rem); font-weight: 700; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <section id="loading" class="screen">
    <p class="text">연결하는 중이에요</p>
  </section>

  <section id="entry" class="screen" hidden>
    <p id="entry-title" class="title"></p>
    <p id="entry-text" class="text"></p>
    <div id="dots" class="dots" aria-live="polite"></div>
    <p id="entry-message" class="message" role="status"></p>
    <div id="keypad" class="keypad"></div>
  </section>

  <section id="choose" class="screen" hidden>
    <p class="title">이름을 골라 주세요</p>
    <p class="sub">같은 번호를 쓰는 학생이 여러 명이에요</p>
    <div id="choices" class="choices"></div>
    <button id="choose-cancel" class="btn" type="button">취소</button>
  </section>

  <section id="result" class="screen" hidden>
    <p id="result-big" class="big"></p>
    <p id="result-time" class="time"></p>
    <p id="result-sub" class="text"></p>
  </section>

  <section id="offline" class="screen" hidden>
    <p class="title">출석부와 연결되지 않아요</p>
    <p class="text">교사 PC가 켜져 있는지, 이 기기가 학원 Wi-Fi에 연결돼 있는지 확인해 주세요.</p>
    <button id="retry" class="btn" type="button">다시 시도</button>
  </section>

  <script>
    const CODE_LENGTH = { pair: 6, digits: 4 };
    const RESULT_MS = 3500;

    const screens = ['loading', 'entry', 'choose', 'result', 'offline'].map((id) => document.getElementById(id));
    const entryTitle = document.getElementById('entry-title');
    const entryText = document.getElementById('entry-text');
    const dotsEl = document.getElementById('dots');
    const entryMessage = document.getElementById('entry-message');
    const keypadEl = document.getElementById('keypad');
    const choicesEl = document.getElementById('choices');
    const resultEl = document.getElementById('result');
    const resultBig = document.getElementById('result-big');
    const resultTime = document.getElementById('result-time');
    const resultSub = document.getElementById('result-sub');

    let mode = 'digits';
    let typed = '';
    let busy = false;
    let pendingDigits = '';
    let resultTimer = null;
    let lastRequest = null;

    // 목적: 출석 기기 API를 부르고 JSON 응답을 돌려받아요.
    // 이유: 등록, 확인, 출석이 같은 요청 방식과 오류 처리를 써요.
    // 방법: JSON POST. 응답이 실패면 서버가 준 message로 예외를 던지고, 네트워크 실패는 그대로 던져요.
    async function api(path, body) {
      const res = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
        cache: 'no-store',
      });
      let data = null;
      try {
        data = await res.json();
      } catch {
        // 본문이 JSON이 아니면 상태 코드로 설명한다
      }
      if (!res.ok) throw new Error((data && data.message) || `서버 오류 (${res.status})`);
      return data;
    }

    // 목적: 화면 하나만 보이게 해요.
    // 이유: 입력, 이름 고르기, 결과, 연결 끊김이 한 페이지 안의 다른 화면이에요.
    // 방법: 대상 화면만 hidden을 풀어요.
    function show(id) {
      for (const screen of screens) screen.hidden = screen.id !== id;
    }

    // 목적: 숫자 키패드를 만들어요.
    // 이유: 등록 코드 입력과 번호 입력이 같은 키패드를 써요.
    // 방법: 1~9, 지우기, 0, 처음부터 순서로 버튼을 만들고 data-key로 동작을 구분해요.
    function buildKeypad() {
      const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'back', '0', 'clear'];
      for (const key of keys) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'key';
        button.dataset.key = key;
        if (key === 'back') {
          button.textContent = '지우기';
          button.classList.add('small');
        } else if (key === 'clear') {
          button.textContent = '처음부터';
          button.classList.add('small');
        } else {
          button.textContent = key;
        }
        keypadEl.append(button);
      }
    }

    // 목적: 입력 화면을 등록 코드용이나 번호용으로 열어요.
    // 이유: 등록되지 않은 기기는 먼저 코드를 입력해야 하고, 등록된 기기는 번호를 받아요.
    // 방법: mode에 맞는 제목과 안내, 칸 수를 그리고 입력값을 비워요.
    function openEntry(nextMode, message) {
      mode = nextMode;
      typed = '';
      if (mode === 'pair') {
        entryTitle.textContent = '출석 기기 등록';
        entryText.textContent = "현황판의 '출석 기기' 창에 나온 6자리 코드를 입력해 주세요.";
      } else {
        entryTitle.textContent = '출석';
        entryText.textContent = '휴대폰번호 뒷 4자리를 눌러 주세요.';
      }
      entryMessage.textContent = message ?? '';
      drawDots();
      show('entry');
    }

    // 목적: 입력한 자리 수만큼 칸을 채워 보여 줘요.
    // 이유: 몇 자리를 눌렀는지 바로 보여야 해요. 번호는 옆 사람이 보지 않게 가려요.
    // 방법: 칸 수만큼 만들고, 번호는 ●, 등록 코드는 숫자 그대로 보여 줘요.
    function drawDots() {
      dotsEl.replaceChildren();
      for (let i = 0; i < CODE_LENGTH[mode]; i++) {
        const dot = document.createElement('span');
        dot.className = 'dot';
        if (i < typed.length) {
          dot.classList.add('filled');
          dot.textContent = mode === 'pair' ? typed[i] : '●';
        }
        dotsEl.append(dot);
      }
    }

    // 목적: 키패드 누름을 처리하고, 자리 수가 다 차면 바로 보내요.
    // 이유: 학생이 확인 버튼을 따로 누르지 않아도 되게 해요.
    // 방법: 보내는 중이면 무시해요. 숫자는 추가, 지우기는 한 자리 삭제, 처음부터는 전부 삭제해요.
    function onKey(event) {
      const button = event.target.closest('.key');
      if (!button || busy) return;
      const key = button.dataset.key;
      entryMessage.textContent = '';
      if (key === 'back') typed = typed.slice(0, -1);
      else if (key === 'clear') typed = '';
      else if (typed.length < CODE_LENGTH[mode]) typed += key;
      drawDots();
      if (typed.length === CODE_LENGTH[mode]) {
        if (mode === 'pair') pair(typed);
        else checkin(typed, null);
      }
    }

    // 목적: 서버 요청 하나를 보내고, 연결이 끊기면 연결 끊김 화면을 보여 줘요.
    // 이유: 교사 PC가 꺼지거나 Wi-Fi가 끊겨도 학생이 다음에 뭘 할지 알아야 해요.
    // 방법: busy로 겹쳐 보내기를 막아요. 실패하면 같은 요청을 "다시 시도"에서 그대로 보낼 수 있게 기억해요.
    async function send(request) {
      busy = true;
      lastRequest = request;
      try {
        await request();
      } catch {
        show('offline');
      } finally {
        busy = false;
      }
    }

    // 목적: 처음 열 때 이 기기가 등록돼 있는지 확인해요.
    // 이유: 등록된 기기면 바로 번호를 받고, 아니면 등록 코드부터 받아야 해요.
    // 방법: hello를 보내 ready면 번호 입력, unpaired면 등록 코드 입력을 열어요.
    function hello() {
      send(async () => {
        const data = await api('/api/kiosk/hello', {});
        if (data.state === 'ready') openEntry('digits');
        else openEntry('pair');
      });
    }

    // 목적: 등록 코드를 보내 이 기기를 출석 기기로 등록해요.
    // 이유: 코드를 본 사람만 출석 기기를 등록할 수 있어요.
    // 방법: 결과마다 안내를 바꿔요. paired면 번호 입력으로 넘어가요.
    function pair(code) {
      send(async () => {
        const data = await api('/api/kiosk/pair', { code });
        if (data.state === 'paired') openEntry('digits', `${data.label}로 등록됐어요.`);
        else if (data.state === 'wrong') openEntry('pair', '코드가 맞지 않아요. 다시 입력해 주세요.');
        else if (data.state === 'full') openEntry('pair', '출석 기기를 더 등록할 수 없습니다. 현황판에서 안 쓰는 기기를 지워 주세요.');
        else openEntry('pair', '코드가 만료됐습니다. 현황판에서 새 코드를 받아 주세요.');
      });
    }

    // 목적: 번호 뒷 4자리(와 고른 학생)를 보내 출석을 기록해요.
    // 이유: 서버가 등원·하원·반복을 정하고, 화면은 그 결과만 보여 줘요.
    // 방법: 상태마다 결과 화면이나 이름 고르기를 보여 줘요. 기기 등록이 취소됐으면 등록 코드 입력으로 돌아가요.
    function checkin(digits, studentId) {
      send(async () => {
        const data = await api('/api/kiosk/checkin', studentId === null ? { digits } : { digits, studentId });
        if (data.state === 'unpaired') {
          openEntry('pair', '이 기기의 등록이 취소됐어요. 새 코드로 다시 등록해 주세요.');
        } else if (data.state === 'choose') {
          showChoices(digits, data.choices);
        } else {
          showResult(data);
        }
      });
    }

    // 목적: 같은 번호를 쓰는 학생 중 본인 이름을 고르게 해요.
    // 이유: 형제자매가 학부모 번호를 함께 쓰거나 뒷 4자리가 겹칠 수 있어요.
    // 방법: 이름 버튼을 textContent로 만들고, 누르면 그 학생 id로 다시 출석을 보내요.
    function showChoices(digits, choices) {
      pendingDigits = digits;
      choicesEl.replaceChildren();
      for (const choice of choices) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'choice';
        button.dataset.id = String(choice.id);
        button.textContent = choice.name;
        choicesEl.append(button);
      }
      show('choose');
    }

    // 목적: 출석 결과를 크게 보여 주고 잠시 뒤 키패드로 돌아가요.
    // 이유: 다음 학생이 바로 입력할 수 있어야 하고, 학생은 자기 이름과 시각을 확인해야 해요.
    // 방법: 상태마다 색과 문구를 정해요. 모르는 상태는 번호 확인 안내로 처리해요. 화면을 누르면 바로 돌아가요.
    function showResult(data) {
      resultEl.className = 'screen';
      resultTime.textContent = '';
      resultSub.textContent = '';
      if (data.state === 'in') {
        resultEl.classList.add('in');
        resultBig.textContent = `${data.name}님 등원했어요`;
        resultTime.textContent = data.time;
      } else if (data.state === 'out') {
        resultEl.classList.add('out');
        resultBig.textContent = `${data.name}님 하원했어요`;
        resultTime.textContent = data.time;
      } else if (data.state === 'already') {
        resultEl.classList.add(data.kind === 'out' ? 'out' : 'in');
        resultBig.textContent = data.kind === 'out' ? `${data.name}님 이미 하원했어요` : `${data.name}님 이미 등원했어요`;
        resultTime.textContent = data.time;
        resultSub.textContent = '10분 뒤에 다시 눌러 주세요.';
      } else {
        resultEl.classList.add('warn');
        resultBig.textContent = '등록되지 않은 번호예요';
        resultSub.textContent = '번호를 다시 확인하고, 그래도 안 되면 선생님께 말씀해 주세요.';
      }
      show('result');
      clearTimeout(resultTimer);
      resultTimer = setTimeout(backToPad, RESULT_MS);
    }

    // 목적: 결과 화면이나 이름 고르기에서 번호 입력으로 돌아가요.
    // 이유: 다음 학생이 기다리지 않고 입력할 수 있어야 해요.
    // 방법: 타이머를 지우고 번호 입력 화면을 새로 열어요.
    function backToPad() {
      clearTimeout(resultTimer);
      openEntry('digits');
    }

    buildKeypad();
    keypadEl.addEventListener('click', onKey);
    choicesEl.addEventListener('click', (event) => {
      const button = event.target.closest('.choice');
      if (!button || busy) return;
      checkin(pendingDigits, Number(button.dataset.id));
    });
    document.getElementById('choose-cancel').addEventListener('click', backToPad);
    resultEl.addEventListener('click', backToPad);
    document.getElementById('retry').addEventListener('click', () => {
      if (lastRequest) send(lastRequest);
      else hello();
    });

    hello();
  </script>
</body>
</html>
