<!doctype html>
<!--
  목적: 학생이 TV의 QR을 찍으면 열리는 폰 화면. 처음 한 번 이름을 고르고, 이후에는 열기만 해도 출석된다.
  사용처: 학생 폰의 기본 카메라/브라우저가 /s?c=<코드> 주소로 연다. 설치는 필요 없다.
  근거: TV 화면(index.html)은 교사 전용이라 학생용 화면을 따로 두었다. 둘은 데이터를 서버로만 주고받는다.
-->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>출석 체크</title>
  <style>
    :root {
      --present: #178a48;
      --absent: #c93c3c;
      --paper: #f4f1ea;
      --ink: #2b2b2b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--paper);
      color: var(--ink);
      font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
      text-align: center;
    }
    main { width: 100%; max-width: 460px; }
    h1 { margin: 0 0 8px; font-size: 1.6rem; line-height: 1.3; }
    p { margin: 0 0 16px; font-size: 1.05rem; line-height: 1.5; }
    .mark { font-size: 4.5rem; line-height: 1; margin-bottom: 12px; }
    .done h1 { color: var(--present); }
    .bad h1 { color: var(--absent); }
    .sub { opacity: 0.7; font-size: 0.95rem; }

    .list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
    .pick {
      min-height: 64px;
      padding: 8px;
      border: 2px solid #b9b4a8;
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 1.15rem;
      font-weight: 700;
      word-break: keep-all;
      cursor: pointer;
    }
    .pick:focus-visible { outline: 3px solid #2b6cff; outline-offset: 2px; }
    .pick:disabled { background: #e6e2d8; color: #8a867b; border-style: dashed; cursor: default; }
    .pick small { display: block; font-size: 0.75rem; font-weight: 400; }
  </style>
</head>
<body>
  <main id="view" aria-live="polite"><p>확인하는 중…</p></main>

  <script>
    const view = document.getElementById('view');
    const code = new URLSearchParams(location.search).get('c') || '';

    // 목적: 서버에 JSON 요청을 보내고 응답을 돌려받는다.
    // 이유: enter/claim 두 호출이 같은 헤더와 오류 처리를 쓴다.
    // 방법: 쿠키(기기 식별자)가 함께 가도록 same-origin으로 POST한다. 네트워크 실패는 호출한 쪽이 잡는다.
    async function post(path, body) {
      const res = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    // 목적: 화면 본문을 제목·설명·꾸밈 글자로 바꿔 그린다.
    // 이유: 상태마다 같은 모양(큰 글자 제목 + 짧은 설명)을 쓴다.
    // 방법: textContent로만 넣어서 이름 등에 든 특수문자가 마크업으로 해석되지 않게 한다.
    function show(kind, mark, title, text) {
      view.replaceChildren();
      view.className = kind;
      const m = document.createElement('div');
      m.className = 'mark';
      m.textContent = mark;
      const h = document.createElement('h1');
      h.textContent = title;
      view.append(m, h);
      if (text) {
        const p = document.createElement('p');
        p.textContent = text;
        view.append(p);
      }
    }

    // 목적: 출석이 끝난 화면을 보여 준다.
    // 이유: 학생이 "내 체크가 됐다"를 바로 알아야 다시 누르지 않는다.
    // 방법: 이름과 함께 큰 체크 표시.
    function showDone(name) {
      show('done', '✅', `${name}님 출석 완료`, '이 폰은 이 이름으로 등록되어 있어요.');
      const sub = document.createElement('p');
      sub.className = 'sub';
      sub.textContent = '이제 화면을 닫아도 돼요.';
      view.append(sub);
    }

    // 목적: 이름 목록을 보여 주고 학생이 자기 이름을 고르게 한다.
    // 이유: 처음 한 번의 이름 선택이 이 폰을 그 이름에 묶는다. 잘못 고르면 선생님이 풀어야 하므로 한 번 더 확인한다.
    // 방법: 이미 등록된 이름은 비활성으로 보여 주고, 선택하면 confirm 후 claim을 호출한다.
    function showChoices(students, notice) {
      show('choose', '👋', '내 이름을 골라 주세요', notice || '처음 한 번만 고르면 돼요. 한 번 고르면 바꿀 수 없어요.');
      const list = document.createElement('div');
      list.className = 'list';
      for (const s of students) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'pick';
        b.disabled = s.taken;
        b.textContent = s.name;
        if (s.taken) {
          const small = document.createElement('small');
          small.textContent = '등록됨';
          b.append(small);
        }
        b.addEventListener('click', () => choose(s));
        list.append(b);
      }
      view.append(list);
    }

    // 목적: 학생이 고른 이름으로 등록을 요청하고 결과에 맞는 화면으로 넘어간다.
    // 이유: 동시에 같은 이름을 고른 다른 학생이 있을 수 있어 서버 판단(taken)을 따라야 한다.
    // 방법: confirm으로 재확인 → claim → done/taken/gone/invalid 분기.
    async function choose(student) {
      if (!confirm(`'${student.name}' 이(가) 본인이 맞나요?\n한 번 고르면 바꿀 수 없어요.`)) return;
      try {
        const r = await post('/api/student/claim', { studentId: student.id });
        if (r.state === 'done') showDone(r.name);
        else if (r.state === 'taken') showChoices(r.students, '방금 다른 사람이 그 이름을 골랐어요. 본인 이름이 맞다면 선생님께 말씀해 주세요.');
        else if (r.state === 'gone') showChoices(r.students, '그 이름은 목록에서 사라졌어요. 다시 골라 주세요.');
        else showExpired();
      } catch {
        showNetworkError();
      }
    }

    // 목적: 만료된 QR 안내를 보여 준다.
    // 이유: 코드가 30초 만에 바뀌므로 늦게 연 학생이 가장 흔히 만나는 상황이다.
    // 방법: 무엇을 하면 되는지(TV의 QR을 다시 찍기)를 안내한다.
    function showExpired() {
      show('bad', '⏱️', 'QR이 만료됐어요', 'TV 화면의 QR을 다시 찍어 주세요.');
    }

    // 목적: 서버에 닿지 못했을 때 안내한다.
    // 이유: 교실 Wi-Fi가 아닌 곳에 연결돼 있으면 가장 먼저 이 상황이 된다.
    // 방법: 교실 Wi-Fi 연결을 확인하도록 안내한다.
    function showNetworkError() {
      show('bad', '📶', '연결할 수 없어요', '교실 Wi-Fi에 연결되어 있는지 확인하고, TV의 QR을 다시 찍어 주세요.');
    }

    // 목적: 페이지가 열리면 코드로 입장해 상태에 맞는 화면을 띄운다.
    // 이유: 이 페이지의 모든 흐름의 시작점이다.
    // 방법: enter 호출 → done/choose/invalid 분기. 코드가 없으면 서버에 묻지 않고 만료 화면.
    async function start() {
      if (!code) {
        showExpired();
        return;
      }
      try {
        const r = await post('/api/student/enter', { code });
        if (r.state === 'done') showDone(r.name);
        else if (r.state === 'choose') showChoices(r.students);
        else showExpired();
      } catch {
        showNetworkError();
      }
    }

    start();
  </script>
</body>
</html>
